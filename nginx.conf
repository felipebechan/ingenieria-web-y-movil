# Configuracion de nginx para servir el frontend compilado.
server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # La aplicacion es de una sola pagina: las rutas las resuelve React Router,
    # asi que cualquier direccion que no sea un archivo devuelve el index.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
